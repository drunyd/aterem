<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aTerem — Órarend és foglalás</title>
  <meta name="description" content="Órarend és foglalás.">
  <meta name="theme-color" content="#F97316">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23F97316'/%3E%3Ctext x='50' y='66' font-size='44' text-anchor='middle' fill='white' font-family='Arial, sans-serif' font-weight='bold'%3EaT%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/client.css">
</head>
<body data-page="oraend">

  <header id="siteHeader"></header>

  <main class="container page">
    <p class="eyebrow">Órarend és foglalás</p>
    <div class="section-head">
      <h1 class="section-title">Órarend</h1>
      <div class="calendar-controls">
        <button id="prevMonth" class="btn btn-icon" aria-label="Előző hónap">&lsaquo;</button>
        <span class="month-label" id="monthLabel" aria-live="polite"></span>
        <button id="nextMonth" class="btn btn-icon" aria-label="Következő hónap">&rsaquo;</button>
        <button id="todayBtn" class="btn btn-outline btn-sm">Ma</button>
      </div>
    </div>

    <div class="sample-banner" role="note">
      <strong>Minta órarend.</strong>
      <span>Az itt látható időpontok illusztrációk — a végleges órarend feltöltése folyamatban.</span>
    </div>

    <div id="filterChips" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px"></div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <div class="calendar-mobile" id="calendarMobile">
      <div class="day-selector" id="daySelector"></div>
      <ul class="day-list" id="dayList"></ul>
    </div>

    <div class="day-detail" id="dayDetail" hidden>
      <h3 class="day-detail-title" id="dayDetailTitle"></h3>
      <ul class="day-detail-list" id="dayDetailList"></ul>
    </div>
  </main>

  <nav id="bottomNav"></nav>
  <footer id="siteFooter"></footer>

  <script src="js/app.js"></script>
</body>
</html>
